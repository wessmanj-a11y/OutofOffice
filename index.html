<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUT OF OFFICE</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="title">OUT OF OFFICE</div>
      <div class="tag">Climb. Burn Out. Escape.</div>
      <div class="subtag">Single player vs. The Corporate Machine</div>
    </section>

    <section id="result"></section>

    <section class="dashboard">
      <div class="panel">Your Burnout<br><span id="burnout">0</span>/12</div>
      <div class="panel">Your Sanity<br><span id="sanity">5</span>/20</div>
      <div class="panel">Your Position<br><span id="position">Intern</span></div>
      <div class="panel rivalPanel">Rival<br><span id="rivalPosition">Associate</span><br><small id="rivalStats"></small></div>
    </section>

    <section id="ladder" class="ladder"></section>

    <section class="controls">
      <button id="openPack">Open Booster Pack</button>
      <button id="newGame">New Game</button>
    </section>

    <section id="pack" class="pack"></section>
    <h2 class="sectionTitle">Your Hand</h2>
    <section id="hand" class="hand"></section>

    <section class="feed">
      <h3>Corporate Feed</h3>
      <div id="log"></div>
    </section>
  </main>

  <script src="./src/app.js"></script>
</body>
</html>
